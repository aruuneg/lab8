name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions MUST be quoted: unquoted 3.10 is parsed by YAML as 3.1
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install flake8 black

      - name: Check formatting with Black
        run: black --check .

      - name: Check style with Flake8
        run: flake8 .

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [test, lint]
    # failure() is true when any job in `needs` failed
    if: ${{ failure() }}
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI failed: ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.EMAIL_TO }}
          from: CI/CD System <${{ secrets.EMAIL_USERNAME }}>
          body: |
            CI туршилт амжилтгүй боллоо!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            test result: ${{ needs.test.result }}
            lint result: ${{ needs.lint.result }}

            Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
